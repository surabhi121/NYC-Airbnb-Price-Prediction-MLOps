## Chapter 11: Continuous integration with GitHub Actions

### The problem

Your 46 tests only protect you if someone runs them. People forget, or they run them against a setup they've tweaked by hand. Continuous integration (CI) runs the tests automatically on a clean machine for every proposed change, and marks the change with a pass or fail before anyone merges it.

GitHub Actions is GitHub's built-in CI. A YAML file in `.github/workflows/` says when to run and what to run.

### Concepts

| Term | Meaning |
|---|---|
| Remote / push | Your repository on GitHub (`origin`). `git push` uploads commits to it |
| Branch | A parallel line of commits. You work on a branch, then merge it into `main` |
| Pull request (PR) | A request to merge a branch into `main`, with discussion and checks |
| Workflow | A YAML file that describes automated jobs |
| Job / step | A workflow has jobs (each on a fresh virtual machine), and a job has steps |
| Runner | GitHub's throwaway machine that runs a job |

The tricky part is that some tests need more than code. The real-registry tests (Chapter 8) need an MLflow server with a `@champion`, and training needs data. GitHub's runner is a brand-new machine with no MLflow and no access to your laptop's DVC storage. So CI builds what it needs from scratch every time:
- a throwaway MLflow server, started inside the job
- a quick champion trained on the committed 2,000-row sample from Chapter 3, which is what the sample was for

```mermaid
flowchart LR
    PR["Pull request\nopened / updated"] --> T
    subgraph gha ["GitHub Actions (fresh Ubuntu machine)"]
        T["job: test\n1 install · 2 start MLflow\n3 seed @champion · 4 pytest"]
        B["job: build-image\ndocker build (no push)"]
        T -- "needs: test" --> B
    end
    B --> S["pass / fail checks on the PR"]
```

### Step 1: `scripts/ci_seed_model.py`

**File: `scripts/ci_seed_model.py`**

```python
"""CI only: train a quick baseline on the committed sample and make it @champion,
so models:/AirbnbPriceModel@champion resolves for tests/test_model_registry.py.

Run as: DATA_PATH=tests/fixtures/listings_sample.csv python -m scripts.ci_seed_model
"""
import mlflow

from features import clean_data, load_data, split_data
from registry import EXPERIMENT_NAME, register_and_promote, require_tracking_uri
from track_experiments import train_and_log


def main():
    require_tracking_uri()
    mlflow.set_experiment(EXPERIMENT_NAME)
    run_id, metrics = train_and_log("linreg_baseline", *split_data(clean_data(load_data())))
    version = register_and_promote(run_id)
    print(f"seeded AirbnbPriceModel v{version} @champion (rmse={metrics['rmse']:.2f})")


if __name__ == "__main__":
    main()
```

It uses the same `train_and_log` and `register_and_promote` as the real pipeline, with no CI-only shortcuts. It trains LinearRegression because that's the fastest, and CI only needs to check that the plumbing works, not which model is best. `DATA_PATH` points it at the sample.

### Step 2: The workflow, `.github/workflows/ci.yml`

**File: `.github/workflows/ci.yml`**

```yaml
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      # The DVC remote lives on a laptop; CI trains on the committed sample.
      DATA_PATH: tests/fixtures/listings_sample.csv
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start ephemeral MLflow server
        run: |
          mlflow server --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlartifacts \
            --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/health && exit 0
            sleep 2
          done
          cat mlflow.log
          exit 1
      - name: Seed AirbnbPriceModel@champion
        run: python -m scripts.ci_seed_model
      - run: pytest -v

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: airbnb-price-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
```

Reading it:

| Part | Meaning |
|---|---|
| `on: pull_request` | Runs when a PR is opened or gets new commits. A plain push to `main` runs nothing |
| `runs-on: ubuntu-latest` | A fresh Linux machine that's thrown away afterwards |
| `env:` | Environment variables for every step. Port 5000 is fine on GitHub's machines, since they don't have AirPlay |
| `MLFLOW_DISABLE_AGENT_HINT: "1"` | Silences an informational MLflow log line (a hint aimed at AI coding tools) so the CI log stays readable. It's harmless either way |
| `actions/checkout` | Downloads your repository onto the machine |
| `setup-python` + `cache: pip` | Installs Python 3.11 and caches downloaded packages between runs |
| `mlflow server … &` | The `&` runs the server in the background so the job can carry on |
| the `for` loop | Waits until the server is actually ready by polling `/health`, instead of guessing with `sleep 30`. If the server never comes up, it prints the server log and fails with a useful message |
| `needs: test` | `build-image` only starts if `test` passed |
| `push: false` | Builds the image to prove the `Dockerfile` works, but doesn't publish unreviewed code. Chapter 12's job handles publishing |
| `cache-from/to: type=gha` | Stores Docker layers in GitHub's cache so later builds are faster |

> [!TIP]
> **Use current action versions.** Actions like `actions/checkout@v7` get new major versions, and old ones eventually stop working. Check for the latest before you write a workflow:
> ```bash
> git ls-remote --tags --refs https://github.com/actions/checkout.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+$' | sort -V | tail -1
> ```

### Step 3: Rehearse CI locally first

Pushing and then waiting minutes to find a typo is slow. Instead, run the same steps against a throwaway server in a temporary folder. It uses port 5055, so your real MLflow on 5001 isn't touched:

```bash
T=$(mktemp -d)
(cd "$T" && exec mlflow server --backend-store-uri sqlite:///mlflow.db \
   --artifacts-destination ./mlartifacts --host 127.0.0.1 --port 5055 > mlflow.log 2>&1) &
until curl -sf http://127.0.0.1:5055/health >/dev/null; do sleep 2; done

MLFLOW_TRACKING_URI=http://127.0.0.1:5055 DATA_PATH=tests/fixtures/listings_sample.csv python -m scripts.ci_seed_model
MLFLOW_TRACKING_URI=http://127.0.0.1:5055 DATA_PATH=tests/fixtures/listings_sample.csv pytest -q

pkill -f "mlflow server.*--port 5055"; rm -rf "$T"
```
Expected:
```
seeded AirbnbPriceModel v1 @champion (rmse=93.98)
46 passed
```
All 46 passed and none were skipped, so the registry tests ran against the seeded champion. The model trained on the sample is worse ($93.98 against $83.54, because it had less data). That's fine, since it only has to pass the sanity checks.

> [!TIP]
> **The parentheses matter.** `( cd … && exec mlflow server … ) &` runs the `cd` inside a background sub-shell, so your own terminal stays in the project folder.

On github.com, click + → New repository. Give it a name (for example `NYC-Airbnb-Price-Prediction`) and make it Public. Don't add a README, `.gitignore` or license, because the repository has to be empty for the first push. Then click Create repository.

```

branch 'main' set up to track 'origin/main'.
```

- `-u` links your `main` to GitHub's `main`, so a plain `git push` or `git pull` later knows where to go.

Make a small, useful change on a new branch, such as a first README:

Predicts a New York City Airbnb listing's nightly price (USD). An end-to-end MLOps practice project.

Within seconds, the PR page shows a CI checks section. Click Details to watch it live. Expect something like this on the first run (times vary):

| Job | Result | Time | Slowest steps |
|---|---|---|---|

### See it fail: a red pull request

Don't skip this one. It's worth knowing early what a CI failure looks like and how to fix it. On the same branch, break a test on purpose: in `tests/test_schemas.py`, change `== "USD"` to `== "EUR"`.
```bash
git commit -am "test: intentional failure to see CI go red"
git push
```
The PR updates and CI runs again, and this time test fails. The log shows the failing test and its error, and build-image never starts (`needs: test`). GitHub also emails you. That's the safety net working: broken code shows up before it reaches `main`.

Undo the change and push:
```bash
git revert --no-edit HEAD
git push
```
CI passes again, and faster than the first time thanks to the cached packages and Docker layers:

| Job | First run | Cached re-run |
|---|---|---|
| test | ~2.5 min | ~2 min |
| build-image | ~1.3 min | ~30 s. The ~500 MB dependency layer was reused, which is Chapter 9's layer ordering paying off |

On the PR, click Merge pull request → Confirm → Delete branch. Then locally:

```

From now on, every change goes through a branch and a pull request, so CI checks it before it reaches `main`.

You no longer have to remember to run the tests or check the Docker build. Every pull request does both.

## Chapter 12: Continuous deployment when the model changes

### The problem

CI checks changes. Continuous deployment (CD) ships them. It builds the API image and publishes it to a registry (Docker Hub) that any server can pull from. In MLOps, a new release can come from new code, and it can also come from a new model:

```mermaid
flowchart LR
    P["Prefect flow\npromotes vN to @champion"] -- "trigger_deploy.py\n(GitHub API, model_version=N)" --> D
    subgraph gha ["GitHub Actions: deploy.yml"]
        D["build image\namd64 + arm64"] --> PUSH["push"]
    end
    PUSH --> HUB[("Docker Hub\n:latest · :model-vN · :commit-sha")]
    HUB -- "docker pull / run" --> SRV["any server or laptop"]
    SRV -- "loads @champion at startup" --> MLF["MLflow"]
```

The image still contains no model (Chapter 9). The `model-vN` tag records which promotion caused the release.

### Concepts

| Term | Meaning |
|---|---|
| Container registry | A website that stores images (Docker Hub, GitHub Container Registry, AWS ECR and others) |
| Tag | A label on one version of an image, such as `:latest` or `:model-v4` |
| `workflow_dispatch` | A trigger for workflows that only run when asked, from the GitHub UI or its API |
| Secret | An encrypted value stored in the repository settings. GitHub hides it in logs |
| Multi-architecture image | One tag that contains builds for several CPU types. GitHub's runners are Intel/AMD (`amd64`), and Apple Silicon Macs are `arm64` |
| QEMU | An emulator that lets an `amd64` runner build the `arm64` version |

### Step 1: Docker Hub account and access token

1. Sign up (it's free) at https://hub.docker.com and note your exact username.
2. Go to Account settings → Personal access tokens → Generate new token. Use the description `github-actions` and the permission Read & Write. Copy the token straight away, because Docker Hub only shows it once.

### Step 2: Store it as GitHub secrets

In your repository, go to Settings → Secrets and variables → Actions → New repository secret, and create two secrets:

| Name | Value |
|---|---|
| `DOCKERHUB_USERNAME` | Your Docker Hub username |
| `DOCKERHUB_TOKEN` | The token from Step 1 |

> [!TIP]
> Paste the token straight from Docker Hub into GitHub's encrypted storage. Never put it in a file, a commit or a chat.

### Step 3: The workflow, `.github/workflows/deploy.yml`

```bash
git switch -c deploy-workflow
```

**File: `.github/workflows/deploy.yml`**

```yaml
name: Deploy

# Runs only when asked: by hand (Actions tab -> Deploy -> Run workflow) or by
# scripts/trigger_deploy.py, which the Prefect flow calls after promoting a new
# @champion. The image doesn't contain the model (it loads @champion at
# startup), so model-v<N> records which promotion triggered this release.
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "AirbnbPriceModel version just promoted to @champion"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # QEMU lets this amd64 runner also build the arm64 (Apple Silicon) image.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # One tag, two builds: Docker picks the right one for each machine.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:model-v${{ inputs.model_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/airbnb-price-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            airbnb.model-version=${{ inputs.model_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
```

Reading it:

| Part | Meaning |
|---|---|
| `on: workflow_dispatch` + `inputs.model_version` | Runs only when asked, and receives the model version |
| `setup-qemu-action` + `platforms: linux/amd64,linux/arm64` | Builds for Intel/AMD and Apple Silicon under one tag |
| `login-action` | Logs in to Docker Hub with the token (never a password) |
| `push: true` | Unlike CI, this job publishes |
| three `tags` | `latest` is the newest, `model-vN` records which champion triggered it, and the commit SHA pins the exact code |
| `labels` | Metadata baked into the image, which `docker image inspect` shows |

> [!TIP]
> **Why build for arm64 too?** The original project first built only for `amd64`, which is what GitHub's runners are. On an Apple Silicon Mac, `docker pull` then failed with `no matching manifest for linux/arm64/v8`. It could still run with `--platform linux/amd64` under emulation, more slowly, but a plain pull failing for every Apple Silicon user wasn't acceptable. The cost is that each deploy takes about 5 minutes instead of about 1, because the arm64 half is built under emulation.

### Step 7: Let the flow trigger deploys with a GitHub token

`trigger_deploy.py` (Chapter 10) calls GitHub's API, and that needs a fine-grained personal access token.

Go to GitHub → your avatar → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token, and set:
- Name: `airbnb-deploy-trigger`, with an expiration (for example 90 days)
- Repository access: Only select repositories, then pick your repository
- Permissions → Repository permissions → Actions: Read and write, and nothing else

> [!WARNING]
> **The permission is the classic mistake.** Fine-grained tokens start with no permissions, and you have to grant each one explicitly. In the original project the token was missing Actions: Read and write, and GitHub answered `403 Resource not accessible by personal access token`.

| Error | Usual cause |
|---|---|
| `401 Bad credentials` | The token isn't exported in this terminal, has expired, or was copied incompletely |
| `403 Resource not accessible by personal access token` | The token lacks Actions: Read and write |
| `404 Not Found` | The token wasn't granted this repository, or there's a typo in `GITHUB_REPO` |

Only use the token in your work terminal, and never put it in a file:
```bash
export GITHUB_REPO=<your-github-username>/<your-repo>
export GITHUB_TOKEN=<paste your token>
```

## Chapter 13: One command for everything with Docker Compose

### The problem

Running the stack by hand means keeping a terminal open for `mlflow server` with its long list of flags, then starting the API with a separate `docker run` with the right ports and environment variables, in the right order. Docker Compose describes all of that in one file, `docker-compose.yml`, and starts it with one command. It also handles the ordering: the API must not start before MLflow is ready, or it has nowhere to load its model from.

```mermaid
flowchart LR
    subgraph mac ["Your computer"]
        subgraph net ["Compose network"]
            MLF["mlflow-server\n:5000 inside\nhealthcheck /health"]
            API["api\n:8000 inside"]
            API -- "http://mlflow-server:5000\n(service name = hostname)" --> MLF
        end
        DISK[("./mlflow.db\n./mlartifacts")]
        MLF -- "folder mounted at /mlflow" --> DISK
        HOST["host tools: Prefect flow,\npytest, browser"]
    end
    HOST -- "127.0.0.1:5001" --> MLF
    HOST -- "127.0.0.1:8001" --> API
```

### Concepts

| Term | Meaning |
|---|---|
| Service | One container definition in `docker-compose.yml` (`mlflow-server`, `api`) |
| Compose network | A private network that Compose creates. Inside it, a service's name is its hostname |
| Bind mount `.:/mlflow` | A folder on your computer that also appears inside the container. Changes show up on both sides |
| Healthcheck | A command Docker runs repeatedly. Once it succeeds, the container counts as healthy |
| `depends_on: condition: service_healthy` | Start this service only after that one is healthy, not merely started |

### The decision: reuse your existing MLflow data

| Option | Trade-off |
|---|---|
| Reuse `./mlflow.db` and `./mlartifacts` (chosen) | All your runs, versions and `@champion` carry over, and host tools keep using `http://127.0.0.1:5001` unchanged. Compose simply replaces your MLflow terminal |
| A fresh, empty Docker volume | Isolated, but empty. You'd have to retrain before the API could start, and you'd end up with two separate histories |

> [!WARNING]
> **Never run two MLflow servers on the same SQLite file.** SQLite is a single file with simple locking, and two servers writing to it at once can corrupt it. So you have to stop the server in the MLflow terminal first.

### Step 1: Back up the MLflow database

Before touching the data, take a consistent snapshot. SQLite's backup API is safe even while the server is running:
```bash
mkdir -p ~/mlflow-backups/nyc-airbnb
python - <<'EOF'
import os, sqlite3, time
target = os.path.expanduser(f"~/mlflow-backups/nyc-airbnb/mlflow-{time.strftime('%Y%m%d-%H%M')}.db")
src, dst = sqlite3.connect("mlflow.db"), sqlite3.connect(target)
src.backup(dst)
dst.close(); src.close()
check = sqlite3.connect(target)
print("backup:", target)
print("integrity:", check.execute("PRAGMA integrity_check").fetchone()[0],
      "| aliases:", check.execute("select alias, version from registered_model_aliases").fetchall())
EOF
```
Expected:
```
backup: /Users/you/mlflow-backups/nyc-airbnb/mlflow-20260924-2320.db
integrity: ok | aliases: [('champion', 4)]
```

### Step 2: Stop the server in the MLflow terminal

In the MLflow terminal, press Ctrl-C and wait for the prompt. Then, in the work terminal:
```bash
lsof -nP -iTCP:5001 -sTCP:LISTEN || echo "port 5001 free"
pgrep -fl "mlflow server" || echo "no mlflow server running"
```
You should see "port 5001 free" and "no mlflow server running". You can close the MLflow terminal now, since Compose replaces it.

### Step 3: Write `docker-compose.yml`

```bash
git switch -c docker-compose
```

**File: `docker-compose.yml`**

```yaml
# One command for the serving stack: the MLflow tracking server + registry,
# and the prediction API. It replaces the separate "mlflow server" terminal
# and the separate `docker run`.
#
# The MLflow service reuses this folder's mlflow.db and mlartifacts/, so all
# runs and @champion carry over. Stop any host `mlflow server` first: two
# servers must never write the same SQLite file.
services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.16.1   # same version as requirements.txt, so same DB schema
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow-server:*"
    volumes:
      # The whole folder, not just mlflow.db: SQLite writes its journal file
      # next to the database, and that must land on disk, not in the container.
      - .:/mlflow
    ports:
      - "5001:5000"   # host 5001: macOS AirPlay Receiver holds 5000
    healthcheck:
      # The MLflow image has Python but not necessarily curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    image: airbnb-price-api:local
    environment:
      # The one setting every component reads; inside Compose's network the
      # MLflow service is reachable by its service name.
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    ports:
      - "8001:8000"   # host 8000 is used by another project's container
    depends_on:
      mlflow-server:
        condition: service_healthy   # don't race MLflow's startup
    restart: on-failure
```

Reading it:

| Part | Meaning |
|---|---|
| `image: ghcr.io/mlflow/mlflow:v3.16.1` | The official MLflow image, pinned to the same version as `requirements.txt`. A different server version might try to migrate your database's structure |
| `sqlite:////mlflow/mlflow.db` | Four slashes: `sqlite:///` followed by the absolute path `/mlflow/mlflow.db` |
| `volumes: - .:/mlflow` | Your project folder appears inside the container at `/mlflow`, so `mlflow.db` and `mlartifacts/` are the same files as before |
| `ports: "5001:5000"` | You reach MLflow on 5001 from your computer. Inside the network it's on 5000 |
| `healthcheck` | Every 10 s, Docker calls MLflow's `/health` endpoint. It uses Python, because the image may not include `curl` |
| `build: .` + `image: airbnb-price-api:local` | Builds the API from your `Dockerfile` and gives it the same name as in Chapter 9 |
| `MLFLOW_TRACKING_URI: http://mlflow-server:5000` | Inside the network, the MLflow service is reachable by its name |
| `depends_on … service_healthy` | Holds the API back until MLflow is healthy |
| `restart: on-failure` | If the API exits with an error, Docker restarts it |

> [!TIP]
> **Why mount the whole folder and not just `mlflow.db`?** When SQLite saves changes, it writes a temporary journal file next to the database. If you mounted only the `.db` file, the journal would live inside the container, and a crash mid-write could leave the database damaged. Mounting the folder keeps both files together on your disk.

> [!NOTE]
> **Windows:** this is where keeping the project on WSL's own disk (not under `/mnt/c/…`) matters. Folder mounts from the Windows drive are slow and can run into permission problems.

Check the file before running anything:
```bash
docker compose config --quiet && echo "compose file valid"
```

### Step 4: Start the stack and watch the ordering

```bash
docker compose up -d --build
```
Expected (trimmed):
```

 Container …-mlflow-server-1  Waiting
 Container …-mlflow-server-1  Healthy
 Container …-api-1            Starting

```
The API only starts once MLflow is healthy. Check its log:
```bash

```
```
INFO:     Loading models:/AirbnbPriceModel@champion from http://mlflow-server:5000
INFO:     Model loaded
INFO:     Application startup complete.
```

### Step 5: Check it

```bash

curl -s -X POST localhost:8001/predict -H 'Content-Type: application/json' -d '{
  "neighbourhood_group": "Manhattan", "neighbourhood": "Midtown",
  "latitude": 40.7549, "longitude": -73.984, "room_type": "Entire home/apt",

  "calculated_host_listings_count": 1, "availability_365": 180}'
# {"predicted_price":244.25,"currency":"USD"}

Your host tools keep working unchanged, at the same address on port 5001:
```bash

In the browser, http://127.0.0.1:5001 shows all your runs and model versions, so nothing was lost.

Now a restart test, to show the data lives on your disk and not inside the containers:
```bash

> [!TIP]
> The MLflow container runs as root but writes into your project folder. On macOS, Docker Desktop maps those files back to your user, so the artifacts from new runs are ordinary files that you own.

> [!NOTE]
> **Windows:** in WSL2, files the container creates may be owned by `root` (check with `ls -l mlartifacts`). If a later host command, such as the cleanup in Appendix E, reports `Permission denied`, take ownership back with `sudo chown -R "$USER" mlflow.db mlartifacts`.

### Step 6: Everyday commands

```bash

docker compose down             # stop and remove the containers (data stays on disk)
```

The Prefect flow works exactly as before, with `MLFLOW_TRACKING_URI=http://127.0.0.1:5001`. After it promotes a new champion, run `docker compose restart api` so the local API serves it.

> [!WARNING]
> From now on, don't also start the old `mlflow server` command while Compose is running, or both would write to the same database.

git push -u origin docker-compose

## Chapter 14: Definition of done, and a README

### The problem

"It worked when I built it" isn't the same as "it works now". Later chapters changed things that earlier ones relied on. So the last job is to re-check everything against the current state (not from memory) and to write the page strangers will read first.

### Step 1: The definition-of-done checklist

Run each check. Every row should pass.

| Requirement | Check | Expected |
|---|---|---|
| The baseline works (Ch 4) | `python train.py` | `rmse: 83.545` |
| Five experiments are tracked (Ch 7) | MLflow UI → `airbnb-price-prediction` | Each of the 5 configs has finished runs with params and metrics |
| The champion loads in a fresh process (Ch 8) | The `python -c "…load_model('models:/AirbnbPriceModel@champion')…"` command from Chapter 8 | `TransformedTargetRegressor 244.25` |
| All tests pass | `pytest -q` (with `MLFLOW_TRACKING_URI` set) | `46 passed` |
| The tests catch bugs | Change a rule in `schemas.py` (for example `availability_365` from `le=365` to `le=400`), run `pytest -q`, then undo it | Exactly one test fails, then all pass again |
| CI runs on pull requests (Ch 11) | Your repository's Pull requests → Closed | Every merged PR shows `test` and `build-image` passing |
| Deploys get published (Ch 12) | Docker Hub tags | `latest` and `model-vN`, for amd64 and arm64 |
| The local stack runs (Ch 13) | `docker compose ps` | MLflow healthy, API up |

### Step 2: Rebuild from GitHub

The strongest proof that a project is complete is a fresh clone with nothing else:
```bash
cd /tmp
git clone https://github.com/<your-github-username>/<your-repo>.git airbnb-check
cd airbnb-check
uv venv --python 3.11 .venv && source .venv/bin/activate
uv pip install -r requirements.txt "dvc==3.67.1"
dvc pull
python train.py | grep rmse
env -u MLFLOW_TRACKING_URI pytest -q
```
Expected:
```
rmse: 83.545
43 passed, 3 skipped
```
Then clean up with `deactivate; cd ~; rm -rf /tmp/airbnb-check`.

> [!TIP]
> `dvc pull` works here because your DVC remote is a folder on this machine. A teammate on another computer couldn't reach it. For that, the remote would need to move to shared storage such as an S3 bucket. CI still works for any clone, because it uses the committed sample.

> [!TIP]
> If your repository's name starts with `-`, use `cd -- -name`. Otherwise the shell reads the name as an option.

### Step 3: Write the README

The README is your repository's front page, written for someone who has never seen the project. These sections work well:

1. What it does: one paragraph, plus a diagram of the whole loop (GitHub renders ```` ```mermaid ```` blocks).
2. Results: the five-model table from Chapter 7, and the champion rule (100 MB or less, lowest RMSE) with its reason.
3. Key decisions: the log target inside the model, the cleaning thresholds, the high-cardinality `neighbourhood` column, and keeping the model out of the image.
4. Project layout: one line per important file (see Appendix A).
5. Setup: the venv, installing, `dvc pull`, and the warning about other Pythons.
6. How to run it: `docker compose up -d`, then running each part by hand, and the tests.
7. CI/CD: what each workflow does and which secrets it needs.
8. Known limitations. Be honest here: modest accuracy, artifact storage that keeps growing, and a DVC remote and MLflow server that only exist on one laptop.

Replace the one-line README from Chapter 11, then commit it through a pull request like any other change.

### Step 4: Shut down cleanly

```bash
docker compose down                 # stop MLflow and the API (data stays on disk)
unset GITHUB_TOKEN                  # or just close the work terminal
```
Then press Ctrl-C in the Prefect terminal. Everything is saved: `mlflow.db`, `mlartifacts/`, and Prefect's history in `~/.prefect`. Running `docker compose up -d` and `prefect server start` brings it all back.

### The finished system

```mermaid
flowchart LR

    subgraph PF ["Prefect flow (weekly, Mon 03:00 UTC)"]
        direction TB
        L["load (retries)"] --> T["train ×5"] --> PR["promote ≤100 MB\nlowest RMSE"] --> TD["trigger deploy"]
    end

    PR -- "alias" --> MLF

    PRS["Pull requests"] --> CI["ci.yml\ntests + build"]
    DC["docker compose up -d"] -.-> MLF
    DC -.-> API
```

### The real problems behind this guide's tips

Every one of these actually happened while we built this project, and each one carries a more general lesson.

| # | Problem | Chapter | Lesson |
|---|---|---|---|
| 1 | A test used a relative path and failed when run from another folder | 3 | Build paths from `__file__`, not from the current directory |
| 2 | An `httpx` deprecation warning | 1, 6 | Read warnings, because they turn into errors later |
| 3 | The API froze silently for about 4 minutes when MLflow was down | 6 | Log before slow calls, and limit retries so failures are fast and clear |
| 4 | Anaconda's `mlflow` and `prefect` shadowed the project's copies | 7, 10 | Check `which <tool>` before trusting a command |
| 5 | AirPlay held port 5000, and another project held a second port | 7, 9 | Check who holds a port before binding to it, and don't stop what isn't yours |
| 6 | skops refused the tree models (`UntrustedTypesFoundException`) | 7 | Test every variant you use, and trust only the exact type you need |
| 7 | A `grep` pipe hid a crash behind exit code 0 | 7 | Check the real program's exit code |
| 8 | The best model was 326 MB | 8 | The best metric isn't the only criterion, so write trade-offs down as rules |
| 9 | Registration went through an MLflow 3 compatibility fallback | 8 | Treat fallback warnings as bugs and use the current API |
| 10 | `mlflow-skinny` didn't include `skops` | 9 | Check a slim image's dependencies explicitly |
| 11 | A personal email nearly went public | 1, 11 | Set a noreply email first, and review what you publish before the first push |
| 12 | The published image didn't run on Apple Silicon | 12 | Build for the platforms your users actually have |
| 13 | A rejected deploy (`403`) was reported as "Completed" | 10, 12 | In a pipeline, failures must raise instead of printing |
| 14 | Moving MLflow into Compose risked two servers on one SQLite file | 13 | Back up first, stop the old server, pin the same version, and mount the folder |

### Where to go next

- Clean up artifacts automatically (Appendix E), or cap or drop the 326 MB forest from the scheduled configs.
- Add better features. Size, bedrooms and amenities would lift accuracy well beyond an R² of about 0.46.
- Move to shared infrastructure: a DVC remote on S3, a hosted MLflow server, and the Prefect flow on a machine that's always on.
- Add monitoring. Log predictions and watch for data drift (new neighbourhoods, shifting prices) to decide when retraining matters.
- Deploy to the cloud by running the published image on a cloud service, with `MLFLOW_TRACKING_URI` pointing at a hosted MLflow.

| Symptom | Cause | Fix | Ch |

| `ModuleNotFoundError: No module named 'features'` when running a script | You ran `python scripts/x.py` | Run it as a module from the project root: `python -m scripts.x` | 3 |
| A test passes from the project root but fails from elsewhere | The test uses a relative path | Build paths from `Path(__file__)` | 3 |
| Nothing appears in the MLflow UI | `MLFLOW_TRACKING_URI` isn't set in this terminal | `export MLFLOW_TRACKING_URI=http://127.0.0.1:5001` | 7 |
| MLflow won't start, or the port is in use | macOS AirPlay Receiver holds 5000 | Use port 5001 (as this guide does) or switch AirPlay Receiver off | 7 |

| `UntrustedTypesFoundException: … sklearn.tree._tree.Tree` | skops blocks tree objects by default | Add `skops_trusted_types=["sklearn.tree._tree.Tree"]` to `log_model` | 7 |

### "My personal email is in my commits"

This is only safe before you've pushed, because it rewrites every commit's ID:
```bash
NR="12345678+yourname@users.noreply.github.com"
git config user.email "$NR"
FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter \
  "export GIT_AUTHOR_EMAIL='$NR' GIT_COMMITTER_EMAIL='$NR'" -- --all
git update-ref -d refs/original/refs/heads/main          # remove filter-branch's backup of the old commits
git reflog expire --expire=now --all && git gc -q --prune=now
git log --format='%ae' | sort -u                         # only the noreply address
```
If you've already pushed, the old commits are public, and rewriting them would break everyone else's copy.

## Appendix D: Glossary

| Term | Meaning |
|---|---|
| Alias | A movable label on a registered model version (`@champion`) |
| Artifact | A file a run produces. Here, the saved model |
| Backend store | MLflow's database of runs, parameters and metrics (`mlflow.db`) |
| Bind mount | A host folder made visible inside a container |
| CI / CD | Continuous integration (test every change) and continuous deployment (ship automatically) |
| Container / image | A running instance, and the read-only package it runs from |
| Cron | A five-field schedule: minute hour day month weekday |
| Deployment (Prefect) | A named, schedulable version of a flow |
| DVC remote | Storage outside the project that holds versioned data |
| Experiment / run | A named group of training runs, and one training attempt |
| Fixture (pytest) | A function that prepares something tests need |
| Flow / task (Prefect) | A pipeline, and one step of it |
| High cardinality | A categorical column with many distinct values |
| Layer (Docker) | One cached step of an image build |
| MAE / RMSE / R² | The average miss, the miss with big errors weighted more, and the share of variation explained |
| MD5 hash | A fingerprint of a file's bytes |
| Multi-arch image | One tag that contains builds for several CPU types (amd64, arm64) |
| Pinning | Recording exact dependency versions (`package==1.2.3`) |
| Pointer file | DVC's small `.dvc` file, which Git tracks in place of the data |
| Pull request (PR) | A proposed merge of a branch, with automated checks |
| Registry (model) | A catalogue of approved model versions |
| Secret (GitHub) | An encrypted repository setting that's hidden in logs |
| skops | A safer model file format than pickle, with an allow-list of loadable types |
| Virtual environment | A private Python and set of libraries for one project |
| workflow_dispatch | A GitHub Actions trigger that only runs when requested |

## Appendix E: Cleanup and freeing disk space

To stop everything: run `docker compose down`, press Ctrl-C in the Prefect terminal, and run `unset GITHUB_TOKEN`.

Disk use grows because every full retrain saves about 377 MB of models. Most of that is the 326 MB `rf_100`, which the size rule never promotes. `du -sh mlartifacts` shows the total.

Deleting a run in MLflow only hides it. Also, in MLflow 3 each model is its own object (a logged model, `models:/m-…`) that outlives its run. So the recipe below deletes both the old `rf_100` runs and their models, then runs `mlflow gc` to erase them for good, files included.

`mlflow gc` works on the database file directly, but it needs a running server to delete the model files, because they're stored through the server's artifact proxy. You can't use Compose's MLflow for this. `gc` on your computer and the server in the container would both write to `mlflow.db`, and SQLite locking isn't reliable across the container boundary. So stop the stack and start a temporary server on your computer just for the cleanup.

> [!WARNING]
> Back up first (Chapter 13, Step 1).

```bash
docker compose down
(exec mlflow server --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlartifacts \
   --host 127.0.0.1 --port 5001 > mlflow.log 2>&1) &
until curl -sf http://127.0.0.1:5001/health >/dev/null; do sleep 2; done
export MLFLOW_TRACKING_URI=http://127.0.0.1:5001
du -sh mlartifacts

python - <<'EOF'
import mlflow
from mlflow import MlflowClient
client = MlflowClient()
champion_run = client.get_model_version_by_alias("AirbnbPriceModel", "champion").run_id
runs = mlflow.search_runs(experiment_names=["airbnb-price-prediction"],
                          filter_string="tags.mlflow.runName = 'rf_100'")
deleted = 0
for run_id in runs["run_id"]:
    if run_id == champion_run:          # never delete what the API serves
        continue
    for output in client.get_run(run_id).outputs.model_outputs:
        client.delete_logged_model(output.model_id)
    client.delete_run(run_id)
    deleted += 1
print("deleted", deleted, "rf_100 runs and their models")
EOF

mlflow gc --backend-store-uri sqlite:///mlflow.db
du -sh mlartifacts
pkill -f "mlflow server.*--port 5001"
while lsof -nP -iTCP:5001 -sTCP:LISTEN >/dev/null; do sleep 1; done   # wait until it has really stopped
docker compose up -d
```
Expected (IDs differ):
```
deleted 4 rf_100 runs and their models
Run with ID … has been permanently deleted.
Logged model with ID m-… has been permanently deleted.
```
You get one line per run and one per model. So far you've done 4 rounds of training (Chapter 7, Chapter 10 twice, and Chapter 12), and the second `du` should come out about 326 MB smaller for each deleted run. Some empty `m-…` folders may stay behind in `mlartifacts/`, but they take up no space. Afterwards, the Chapter 8 Step 6 command still prints `TransformedTargetRegressor 244.25`, because the champion wasn't touched.

> [!NOTE]
> We tested this recipe on a throwaway setup (a scratch server with a few `rf_100` runs), not on the original project's data. That's why the backup comes first.

Revoke the tokens you no longer need. On GitHub, go to Settings → Developer settings → Personal access tokens. On Docker Hub, go to Account settings → Personal access tokens.

    var h2 = block.querySelector(":scope > h2");
    if (!h2) return;
    var label2 = h2.getAttribute("data-label");
    var isChapter = /^Chapter/.test(label2 || "");
    var li = el("li", "station");
    var a = el("a");
    a.href = "#" + h2.id;
    a.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' +
      (label2 ? '<span class="ch-no">' + escapeHtml(label2) + "</span>" : "") +
      escapeHtml(h2.getAttribute("data-short") || h2.getAttribute("data-title")) + "</span>";
    li.appendChild(a);
    var subs = el("ol", "subs");
    Array.prototype.forEach.call(block.querySelectorAll("h3"), function (h3) {
      var sa = el("a", null, escapeHtml(h3.getAttribute("data-title")));
      sa.href = "#" + h3.id;
      var sli = el("li"); sli.appendChild(sa); subs.appendChild(sli);
    });
    if (subs.children.length) li.appendChild(subs);
    lineEl.appendChild(li);
    var entry = { section: block, h2: h2, li: li, isChapter: isChapter };
    chapters.push(entry);
  });

  // ---------- 7. chapter completion + next links ----------
  var done = {};
  try { (JSON.parse(store(STORE_DONE) || "[]") || []).forEach(function (id) { done[id] = true; }); } catch (e) { done = {}; }
  var chapterEntries = chapters.filter(function (c) { return c.isChapter; });
  function paintDone() {
    var count = 0;
    chapterEntries.forEach(function (c) {
      var isDone = !!done[c.h2.id];
      if (isDone) count++;
      c.li.classList.toggle("done", isDone);
      if (c.button) {
        c.button.setAttribute("aria-pressed", isDone ? "true" : "false");
        c.button.textContent = isDone ? "Chapter complete" : "Mark " + c.h2.getAttribute("data-label") + " complete";
      }
    });
    document.getElementById("meter-text").textContent = count + " of " + chapterEntries.length + " chapters complete";
    document.getElementById("meter-fill").style.width = (chapterEntries.length ? 100 * count / chapterEntries.length : 0) + "%";
  }
  chapters.forEach(function (c, i) {
    var foot = el("div", "chapter-foot");
    if (c.isChapter) {
      var b = el("button", "done-btn");
      b.type = "button";
      b.addEventListener("click", function () {
        if (done[c.h2.id]) delete done[c.h2.id]; else done[c.h2.id] = true;
        store(STORE_DONE, JSON.stringify(Object.keys(done)));
        paintDone();
      });
      c.button = b;
      foot.appendChild(b);
    }
    var next = chapters[i + 1];
    if (next) {
      var nl = el("a", "next-link");
      nl.href = "#" + next.h2.id;
      nl.innerHTML = "<small>Next</small><span>" +
        escapeHtml((next.h2.getAttribute("data-label") ? next.h2.getAttribute("data-label") + ": " : "") +
        (next.h2.getAttribute("data-short") || next.h2.getAttribute("data-title"))) + " →</span>";
      foot.appendChild(nl);
    }
    if (foot.children.length) c.section.appendChild(foot);
  });
  paintDone();

  // ---------- 8. copy buttons ----------
  article.addEventListener("click", function (e) {
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var code = btn.closest(".code").querySelector("pre code");
    var text = code.textContent.replace(/\n$/, "");
    function ok() {
      btn.textContent = "Copied"; btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
    }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(code);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = "Selected, press ⌘C";
      setTimeout(function () { btn.textContent = "Copy"; }, 2400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  // ---------- 9. navigation: in-page links, drawer ----------
  function closeNav() {
    document.body.classList.remove("nav-open");
    document.getElementById("menu-btn").setAttribute("aria-expanded", "false");
  }
  document.getElementById("menu-btn").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNav(); });
  function goTo(id, smooth) {
    var target = document.getElementById(id);
    if (!target) return;
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* hash is optional */ }
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!document.getElementById(id)) return;
    e.preventDefault();
    closeNav();
    goTo(id, true);
  });

  // ---------- 10. scroll spy + progress ----------
  var spyHeads = Array.prototype.slice.call(article.querySelectorAll("section.chapter > h2, section.chapter h3"));
  var progress = document.getElementById("progress");
  var topbarTitle = document.getElementById("topbar-title");
  var ticking = false, lastChapter = null, lastSub = null;
  function spy() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    progress.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
    var active = null;
    for (var i = 0; i < spyHeads.length; i++) {
      if (spyHeads[i].getBoundingClientRect().top < 140) active = spyHeads[i]; else break;
    }
    var chapter = active ? chapters.filter(function (c) { return c.section.contains(active); })[0] : null;
    if (chapter !== lastChapter) {
      if (lastChapter) lastChapter.li.classList.remove("current");
      if (chapter) {
        chapter.li.classList.add("current");
        topbarTitle.textContent = (chapter.h2.getAttribute("data-label") ? chapter.h2.getAttribute("data-label") + " · " : "") +
          (chapter.h2.getAttribute("data-short") || chapter.h2.getAttribute("data-title"));
        var sidebar = document.getElementById("sidebar");
        var r = chapter.li.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 40) {
          sidebar.scrollTop += r.top - window.innerHeight / 3;
        }
      } else {
        topbarTitle.textContent = "MLOps from Scratch";
      }
      lastChapter = chapter;
    }
    var sub = active && active.tagName === "H3" ? toc.querySelector('.subs a[href="#' + active.id + '"]') : null;
    if (sub !== lastSub) {
      if (lastSub) lastSub.classList.remove("current");
      if (sub) sub.classList.add("current");
      lastSub = sub;
    }
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
  window.addEventListener("resize", spy);

  // ---------- 11. search ----------
  var search = document.getElementById("search");
  var results = document.getElementById("results");
  var index = [];
  Array.prototype.forEach.call(article.querySelectorAll("h2, h3"), function (h) {
    var owner = chapters.filter(function (c) { return c.section.contains(h); })[0];
    index.push({ id: h.id, text: (h.getAttribute("data-title") || ""),
      where: owner && owner.h2 !== h ? (owner.h2.getAttribute("data-label") || owner.h2.getAttribute("data-title")) : "" });
  });
  Array.prototype.forEach.call(article.querySelectorAll(".kind-file .label b"), function (b) {
    var box = b.closest(".code");
    var owner = chapters.filter(function (c) { return c.section.contains(box); })[0];
    if (!box.id) box.id = slugify("file " + b.textContent);
    index.push({ id: box.id, text: b.textContent, where: "File" + (owner && owner.h2.getAttribute("data-label") ? " · " + owner.h2.getAttribute("data-label") : "") });
  });
  var activeResult = 0;
  function runSearch() {
    var q = search.value.trim().toLowerCase();
    if (!q) { results.hidden = true; toc.hidden = false; return; }
    var terms = q.split(/\s+/);
    var hits = index.filter(function (item) {
      var hay = (item.text + " " + item.where).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    }).slice(0, 25);
    results.innerHTML = "";
    if (!hits.length) results.appendChild(el("li", "empty", "No heading or file matches \"" + escapeHtml(search.value.trim()) + "\"."));
    hits.forEach(function (item, i) {
      var li = el("li");
      var a = el("a", i === 0 ? "active" : "", escapeHtml(item.text) + (item.where ? "<small>" + escapeHtml(item.where) + "</small>" : ""));
      a.href = "#" + item.id;
      li.appendChild(a); results.appendChild(li);
    });
    activeResult = 0;
    results.hidden = false; toc.hidden = true;
  }
  search.addEventListener("input", runSearch);
  search.addEventListener("keydown", function (e) {
    var links = results.querySelectorAll("a");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!links.length) return;
      e.preventDefault();
      links[activeResult].classList.remove("active");
      activeResult = (activeResult + (e.key === "ArrowDown" ? 1 : links.length - 1)) % links.length;
      links[activeResult].classList.add("active");
    } else if (e.key === "Enter" && links.length) {
      e.preventDefault();
      links[activeResult].click();
    } else if (e.key === "Escape") {
      search.value = ""; runSearch(); search.blur();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    if (window.matchMedia("(max-width: 960px)").matches) document.body.classList.add("nav-open");
    search.focus();
  });

  // ---------- 12. theme + diagrams ----------
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.getElementById("theme-btn").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store(STORE_THEME, next);
  });

  var ownMermaid = false;
  function token(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function renderDiagrams() {
    var diagrams = article.querySelectorAll("pre.mermaid");
    Array.prototype.forEach.call(diagrams, function (d) {
      d.removeAttribute("data-processed");
      d.textContent = d.getAttribute("data-src");
    });
    window.mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      fontFamily: token("--body"),
      flowchart: { htmlLabels: true, curve: "basis" },
      themeVariables: {
        darkMode: isDark(),
        background: token("--surface"),
        fontSize: "14px",
        primaryColor: token("--accent-soft"),
        primaryBorderColor: token("--accent"),
        primaryTextColor: token("--ink"),
        secondaryColor: token("--ground"),
        tertiaryColor: token("--ground"),
        lineColor: token("--muted"),
        textColor: token("--ink"),
        clusterBkg: token("--ground"),
        clusterBorder: token("--rule"),
        edgeLabelBackground: token("--surface"),
        titleColor: token("--ink"),
        actorBkg: token("--accent-soft"),
        actorBorder: token("--accent"),
        actorTextColor: token("--ink"),
        signalColor: token("--ink-2"),
        signalTextColor: token("--ink"),
        labelBoxBkgColor: token("--ground"),
        labelBoxBorderColor: token("--rule"),
        labelTextColor: token("--ink"),
        loopTextColor: token("--ink"),
        noteBkgColor: token("--warn-bg"),
        noteBorderColor: token("--warn-line"),
        noteTextColor: token("--ink")
      }
    });
    window.mermaid.run({ nodes: diagrams }).catch(function () { /* the source stays visible */ });
  }
  function loadMermaid() {
    var pending = Array.prototype.some.call(article.querySelectorAll("pre.mermaid"), function (d) {
      return !d.querySelector("svg");
    });
    if (!pending) return;
    var s = document.createElement("script");
    s.src = MERMAID_URL;
    s.onload = function () { ownMermaid = true; renderDiagrams(); };
    document.head.appendChild(s);
  }
  // Some hosts render mermaid themselves; only load the library if nothing drew the diagrams.
  setTimeout(loadMermaid, 900);
  function onThemeChange() { if (ownMermaid) renderDiagrams(); }
  new MutationObserver(onThemeChange).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", onThemeChange);
  }

  // ---------- 13. start ----------
  var initial = decodeURIComponent((location.hash || "").slice(1));
  if (initial && document.getElementById(initial)) goTo(initial, false);
  spy();
})();
</script>
</body>
</html>
